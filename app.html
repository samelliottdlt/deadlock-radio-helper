<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://i.ytimg.com; frame-src https://www.youtube.com">
<title>DLP:{"s":-9}</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 14px system-ui, sans-serif; overflow: hidden; }
  /* Plain arrow everywhere: the game takes over the page's cursor and can keep it after the menu closes. */
  * { cursor: default !important; }
  body { display: flex; flex-direction: column; }
  form { display: flex; gap: 6px; padding: 8px; background: #1b1b1b; flex: none; }
  input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid #444; border-radius: 6px; background: #000; color: #eee; font: inherit; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #c9a227; color: #000; font: inherit; font-weight: 600; }
  #msg { padding: 0 10px; height: 18px; font-size: 12px; color: #e88; flex: none; }
  #stage { position: relative; height: 46%; flex: none; background: #000; }
  /* The player never takes clicks or keyboard focus (focus inside YouTube's frame swallows Esc); the bar below controls it. */
  #stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #777; text-align: center; padding: 20px; }
  #ctl { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #1b1b1b; flex: none; }
  #ctl button { padding: 4px 10px; background: #333; color: #eee; min-width: 40px; }
  #ctl button:hover { background: #444; }
  #bar { flex: 1; height: 8px; background: #333; border-radius: 4px; position: relative; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #c9a227; border-radius: 4px; }
  #time { font-variant-numeric: tabular-nums; color: #aaa; font-size: 12px; min-width: 84px; text-align: right; }
  #recent { overflow-y: auto; flex: 1; min-height: 0; padding: 4px 8px; }
  #recent div { display: flex; align-items: center; gap: 8px; padding: 4px; border-radius: 4px; }
  #recent div:hover { background: #222; }
  #recent img { width: 64px; height: 36px; object-fit: cover; flex: none; }
  #recent span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Steam's in-game browser only hands the game a new picture when the page repaints, and the game can lose the
     old one; keep a tiny corner element changing so a page with nothing playing doesn't vanish. */
  #keep { position: fixed; right: 0; bottom: 0; width: 2px; height: 2px; animation: keep 0.5s steps(2) infinite; }
  @keyframes keep { from { background: #111; } to { background: #131313; } }
</style>
</head>
<body>
<form id="f">
  <input id="u" placeholder="Paste a YouTube link (video, playlist, youtu.be, shorts) or video ID" autocomplete="off" spellcheck="false">
  <button type="submit">Play</button>
</form>
<div id="msg"></div>
<div id="stage"><div id="hint">Paste a YouTube link above and press Play.</div></div>
<div id="ctl">
  <button id="bPrev" title="Previous">&#9664;&#9664;</button>
  <button id="bPlay" title="Play / pause">&#9654;</button>
  <button id="bNext" title="Next">&#9654;&#9654;</button>
  <div id="bar"><div id="fill"></div></div>
  <span id="time">0:00 / 0:00</span>
</div>
<div id="recent"></div>
<div id="keep"></div>
<script>
// Link-box YouTube player for the patched Deadlock Radio mod.
// Commands: change only the hash to "#<seq>:<cmd>[:<arg>[:<arg>]]"
//           cmds: vol:<0-100>, fade:<0-100>:<seconds>, play, pause, next, prev, seek:<seconds>, save:nv:<0-100>, submit
// Reports:  document.title = 'DLP:' + JSON { s: state, t: time, d: duration, v: volume, m: muted, id, ti: title, au: author, e: error, nv: saved volume or -1, k: Esc presses }
(function () {
  var stage = document.getElementById('stage');
  var input = document.getElementById('u');
  var msg = document.getElementById('msg');
  var recentBox = document.getElementById('recent');
  var f = null, heard = false, ready = false;
  var vol = 20;
  var st = { s: -9, t: 0, d: 0, v: -1, m: 0, id: '', ti: '', au: '', e: '' };
  var current = null;

  var volm = /[?&]vol=(\d{1,3})(?:&|$)/.exec(location.search);
  if (volm) vol = Math.min(100, Number(volm[1]));
  var savedNv = -1;
  try { var sn = localStorage.getItem('dlr_nv'); if (sn !== null && /^\d{1,3}$/.test(sn)) { savedNv = Math.min(100, Number(sn)); vol = savedNv; } } catch (e) {}

  function parseLink(text) {
    text = String(text || '').trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(text)) return { id: text, list: '', index: 0, start: 0 };
    var u;
    try { u = new URL(/^https?:/i.test(text) ? text : 'https://' + text); } catch (e) { return null; }
    var host = u.hostname.replace(/^(www|m|music)[.]/, '');
    var id = '', list = u.searchParams.get('list') || '';
    if (host === 'youtu.be') id = u.pathname.slice(1, 12);
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      var pm = /^[/](shorts|embed|live|v)[/]([A-Za-z0-9_-]{11})/.exec(u.pathname);
      id = pm ? pm[2] : (u.searchParams.get('v') || '');
    } else return null;
    if (id && !/^[A-Za-z0-9_-]{11}$/.test(id)) id = '';
    if (list && !/^[A-Za-z0-9_-]{10,64}$/.test(list)) list = '';
    if (!id && !list) return null;
    var t = u.searchParams.get('t') || u.searchParams.get('start') || '';
    var tm = /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/.exec(t);
    var start = tm ? (Number(tm[1] || 0) * 3600 + Number(tm[2] || 0) * 60 + Number(tm[3] || 0)) : 0;
    return { id: id, list: list, index: Number(u.searchParams.get('index') || 0), start: start };
  }

  function embedUrl(p) {
    var q = 'enablejsapi=1&autoplay=1&playsinline=1&rel=0&controls=0&disablekb=1';
    if (p.list) q += '&list=' + p.list + (p.index > 0 ? '&index=' + (p.index - 1) : '');
    if (p.start > 0) q += '&start=' + p.start;
    return 'https://www.youtube.com/embed/' + (p.id || 'videoseries') + '?' + q;
  }

  function play(p, raw) {
    current = { raw: raw, p: p };
    msg.textContent = '';
    st.e = '';
    if (f && ready) {
      // Keep one player: YouTube counts every new player as another streaming device for a while.
      if (p.list) cmd('loadPlaylist', [{ list: p.list, listType: 'playlist', index: Math.max(0, p.index - 1), startSeconds: p.start }]);
      else cmd('loadVideoById', [{ videoId: p.id, startSeconds: p.start }]);
      st.id = p.id; st.ti = ''; st.au = ''; st.d = 0; st.t = 0;
      return;
    }
    stopOld();
    f = document.createElement('iframe');
    f.allow = 'autoplay; encrypted-media; fullscreen';
    f.addEventListener('load', function () { heard = false; ready = false; });
    f.src = embedUrl(p);
    stage.appendChild(f);
    st = { s: -1, t: 0, d: 0, v: -1, m: 0, id: p.id, ti: '', au: '', e: '' };
  }

  function loadRecent() { try { return JSON.parse(localStorage.getItem('dlr_recent') || '[]'); } catch (e) { return []; } }
  function saveRecent(list) { try { localStorage.setItem('dlr_recent', JSON.stringify(list.slice(0, 12))); } catch (e) {} }
  function remember(raw, id, title) {
    var list = loadRecent().filter(function (r) { return r.raw !== raw; });
    list.unshift({ raw: raw, id: id, title: title || raw });
    saveRecent(list);
    drawRecent();
  }
  function drawRecent() {
    recentBox.innerHTML = '';
    loadRecent().forEach(function (r) {
      var row = document.createElement('div');
      if (r.id) { var img = document.createElement('img'); img.src = 'https://i.ytimg.com/vi/' + r.id + '/mqdefault.jpg'; row.appendChild(img); }
      var span = document.createElement('span');
      span.textContent = r.title;
      row.appendChild(span);
      row.addEventListener('click', function () { var p = parseLink(r.raw); if (p) { input.value = r.raw; play(p, r.raw); } });
      recentBox.appendChild(row);
    });
  }

  // Called by the form and by the mod's "submit" command (the game may swallow Enter before this page sees it).
  var lastSubmit = { raw: '', at: 0 };
  function submitLink() {
    var raw = input.value.trim();
    if (!raw) return;
    if (raw === lastSubmit.raw && Date.now() - lastSubmit.at < 1000) return;
    lastSubmit = { raw: raw, at: Date.now() };
    var p = parseLink(raw);
    if (!p) { msg.textContent = "That doesn't look like a YouTube link."; return; }
    play(p, raw);
    remember(raw, p.id, '');
    input.blur();
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    submitLink();
  });

  function post(o) { if (f) { try { f.contentWindow.postMessage(JSON.stringify(o), '*'); } catch (x) {} } }
  function cmd(func, args) { post({ event: 'command', func: func, args: args || [] }); }

  // Stop the old player before removing it, so YouTube ends that session instead of timing it out.
  function stopOld() {
    var hint = document.getElementById('hint');
    if (hint) hint.remove();
    if (!f) return;
    var old = f;
    try { old.contentWindow.postMessage(JSON.stringify({ event: 'command', func: 'stopVideo', args: [] }), '*'); } catch (x) {}
    old.style.visibility = 'hidden';
    f = null;
    setTimeout(function () { old.remove(); }, 800);
  }
  window.addEventListener('pagehide', function () { cmd('stopVideo'); });

  // Esc is reported to the mod (the game never sees key presses while this page has focus).
  var escCount = 0;
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') escCount++; }, true);

  // The mod only gives this page keyboard focus while the link box is in use (ia: 1), so that otherwise Esc goes
  // straight to the game. Ask for it on a press in the box; give it back on any other press, blur or submit.
  var wantKeys = 0;
  function setWantKeys(v) { if (wantKeys !== v) { wantKeys = v; report(); } }
  document.addEventListener('pointerdown', function (e) { setWantKeys(e.target === input ? 1 : 0); }, true);
  input.addEventListener('focus', function () { setWantKeys(1); });
  input.addEventListener('blur', function () { setWantKeys(0); });

  // Control bar (the player itself takes no clicks, so keyboard focus always stays on this page).
  var fill = document.getElementById('fill'), timeEl = document.getElementById('time'), bPlay = document.getElementById('bPlay');
  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (x < 10 ? '0' : '') + x;
  }
  document.getElementById('bPrev').addEventListener('click', function () { cmd('previousVideo'); });
  document.getElementById('bNext').addEventListener('click', function () { cmd('nextVideo'); });
  bPlay.addEventListener('click', function () { if (st.s === 1 || st.s === 3) cmd('pauseVideo'); else cmd('playVideo'); });
  document.getElementById('bar').addEventListener('click', function (e) {
    if (!(st.d > 0)) return;
    var r = this.getBoundingClientRect();
    cmd('seekTo', [Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * st.d, true]);
  });
  var shownPlaying = null;
  function drawCtl() {
    fill.style.width = (st.d > 0 ? Math.min(100, st.t / st.d * 100) : 0) + '%';
    timeEl.textContent = fmt(st.t) + ' / ' + fmt(st.d);
    var playing = st.s === 1 || st.s === 3;
    if (playing !== shownPlaying) { shownPlaying = playing; bPlay.innerHTML = playing ? '&#10074;&#10074;' : '&#9654;'; }
  }

  var fadeT = null;
  function setVol(v) {
    v = Math.max(0, Math.min(100, Math.round(v)));
    vol = v;
    cmd('setVolume', [v]);
    if (v > 0) cmd('unMute');
  }
  function fadeTo(target, sec) {
    if (fadeT) { clearInterval(fadeT); fadeT = null; }
    var from = st.v >= 0 ? st.v : vol;
    var steps = Math.max(1, Math.round((sec || 0) * 20));
    if (steps <= 1 || !ready) { setVol(target); return; }
    var i = 0;
    fadeT = setInterval(function () {
      i++;
      setVol(from + (target - from) * (i / steps));
      if (i >= steps) { clearInterval(fadeT); fadeT = null; }
    }, 50);
  }

  window.addEventListener('message', function (e) {
    if (!f || e.source !== f.contentWindow) return;
    var d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch (x) { return; } }
    if (!d) return;
    heard = true;
    if (d.event === 'onReady' && !ready) {
      ready = true;
      setVol(vol);
      cmd('playVideo');
    }
    if (d.event === 'onError') { st.e = 'err' + d.info; msg.textContent = 'YouTube refused to play this (error ' + d.info + ').'; }
    if (d.event === 'onStateChange' && typeof d.info === 'number') st.s = d.info;
    var i = d.info;
    if (i && typeof i === 'object') {
      if (typeof i.playerState === 'number') st.s = i.playerState;
      if (typeof i.currentTime === 'number') st.t = i.currentTime;
      if (i.duration > 0) st.d = i.duration;
      if (typeof i.volume === 'number') st.v = i.volume;
      if (typeof i.muted === 'boolean') st.m = i.muted ? 1 : 0;
      if (i.videoData && i.videoData.video_id) {
        st.id = i.videoData.video_id;
        st.ti = String(i.videoData.title || '').substring(0, 120);
        st.au = String(i.videoData.author || '').substring(0, 60);
        if (current && st.ti && current.p.id === st.id) {
          var list = loadRecent();
          for (var k = 0; k < list.length; k++) if (list[k].raw === current.raw && list[k].title !== st.ti) { list[k].title = st.ti; list[k].id = st.id; saveRecent(list); drawRecent(); break; }
        }
      }
    }
  });

  var lastSeq = 0;
  function runHash() {
    var p = location.hash.replace(/^#/, '').split(':');
    var seq = Number(p[0]);
    if (!(seq > lastSeq)) return;
    lastSeq = seq;
    var c = p[1], a = Number(p[2]), b = Number(p[3]);
    if (c === 'vol' && a >= 0) { if (fadeT) { clearInterval(fadeT); fadeT = null; } if (ready) setVol(a); else vol = a; }
    else if (c === 'fade' && a >= 0) { if (ready) fadeTo(a, b || 0); else vol = a; }
    else if (c === 'play') cmd('playVideo');
    else if (c === 'pause') cmd('pauseVideo');
    else if (c === 'next') cmd('nextVideo');
    else if (c === 'prev') cmd('previousVideo');
    else if (c === 'seek' && a >= 0) cmd('seekTo', [a, true]);
    else if (c === 'save' && p[2] === 'nv' && b >= 0 && b <= 100) { savedNv = Math.round(b); try { localStorage.setItem('dlr_nv', String(savedNv)); } catch (e) {} }
    else if (c === 'submit') submitLink();
  }
  window.addEventListener('hashchange', runHash);

  drawRecent();
  var lastTitle = '', lastAt = 0;
  function report() {
    var title = 'DLP:' + JSON.stringify({ s: st.s, t: Math.round(st.t * 10) / 10, d: Math.round(st.d), v: st.v, m: st.m, id: st.id, ti: st.ti, au: st.au, e: st.e, nv: savedNv, k: escCount, ia: wantKeys });
    var now = Date.now();
    if (title !== lastTitle || now - lastAt > 2000) { lastTitle = title; lastAt = now; document.title = title; }
  }
  setInterval(function () {
    if (f && !heard) post({ event: 'listening', id: 1, channel: 'widget' });
    drawCtl();
    report();
  }, 500);
})();
</script>
</body>
</html>
